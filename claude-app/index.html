<style>
/* Layout: app de uma coluna no estilo iPhone — barra superior, listas agrupadas, barra de abas fixa embaixo e formulários em folhas que sobem. */
:root {
  --bg: #f2f3f7;
  --card: #ffffff;
  --card-2: #f4f5f8;
  --press: rgba(40, 50, 80, .07);
  --fg: #0f1115;
  --fg-2: #5b6170;
  --fg-3: #8a90a0;
  --sep: rgba(60, 64, 80, .16);
  --accent: #1f66d1;
  --accent-soft: #dfe9fa;
  --on-accent: #ffffff;
  --pos: #1c7c46;
  --pos-soft: #dcf1e4;
  --neg: #c93a31;
  --neg-soft: #fbe3e1;
  --warn: #a86400;
  --warn-soft: #fbedd3;
  --glow: #f2a900;
  --seg-bg: #e4e6ec;
  --bar-bg: rgba(242, 243, 247, .86);
  --tip-bg: #1d2027;
  --tip-fg: #f4f5f7;
  --switch-off: #dcdee5;
  --series-1: #2a78d6;
  --series-1-soft: #dbe8f8;
  --series-2: #eb6834;
  --grid: #e5e7ed;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 12px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c0f; --card: #17191e; --card-2: #20232a; --press: rgba(255, 255, 255, .06);
    --fg: #f2f3f5; --fg-2: #a9afbc; --fg-3: #7b8291; --sep: rgba(235, 238, 245, .13);
    --accent: #5b9bf0; --accent-soft: #1b2a42; --on-accent: #0b0c0f;
    --pos: #4cc27e; --pos-soft: #16301f; --neg: #f0675e; --neg-soft: #3a1b19; --warn: #e7a33a; --warn-soft: #3a2a12;
    --glow: #ffc93d; --seg-bg: #23262d; --bar-bg: rgba(11, 12, 15, .82); --tip-bg: #f1f2f4; --tip-fg: #121418;
    --switch-off: #3a3d45; --series-1: #3987e5; --series-1-soft: #1a2c45; --series-2: #d95926; --grid: #262930;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c0f; --card: #17191e; --card-2: #20232a; --press: rgba(255, 255, 255, .06);
  --fg: #f2f3f5; --fg-2: #a9afbc; --fg-3: #7b8291; --sep: rgba(235, 238, 245, .13);
  --accent: #5b9bf0; --accent-soft: #1b2a42; --on-accent: #0b0c0f;
  --pos: #4cc27e; --pos-soft: #16301f; --neg: #f0675e; --neg-soft: #3a1b19; --warn: #e7a33a; --warn-soft: #3a2a12;
  --glow: #ffc93d; --seg-bg: #23262d; --bar-bg: rgba(11, 12, 15, .82); --tip-bg: #f1f2f4; --tip-fg: #121418;
  --switch-off: #3a3d45; --series-1: #3987e5; --series-1-soft: #1a2c45; --series-2: #d95926; --grid: #262930;
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg); margin: 0;
  font: 16px/1.4 var(--font);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar-bg);
}
body.sheet-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ico { width: 22px; height: 22px; flex: none; }
.chev { width: 16px; height: 16px; flex: none; color: var(--fg-3); }

.app { max-width: 680px; margin: 0 auto; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Barra superior */
#bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px;
  background: var(--bar-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 0 0 100vmax var(--bar-bg); clip-path: inset(0 -100vmax);
}
.bar-side { display: flex; align-items: center; min-width: 0; }
.bar-side.end { justify-content: flex-end; }
.bar-title { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; text-align: center; }
.back { display: flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--accent); font-size: 17px; padding: 6px 4px 6px 0; margin-left: -6px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--accent); border-radius: 10px; }
.icon-btn:active { background: var(--press); }
.icon-btn.flip svg { transform: rotate(180deg); }
.icon-btn:disabled { color: var(--fg-3); }

.large-title { font-family: var(--font-display); font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 12px; text-wrap: balance; }

/* Barra de abas */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 6px var(--gutter-r) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: var(--bar-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--sep);
}
.tabbar-inner { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--fg-3); font-size: 10.5px; font-weight: 500; padding: 4px 0; }
.tabbar button[aria-current="page"] { color: var(--accent); }
.tabbar .tab-add .plus { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 14px rgba(31, 102, 209, .3); }
.tabbar .tab-add .plus .ico { width: 24px; height: 24px; stroke-width: 2.4; }

/* Navegação de período */
.periodnav { display: flex; align-items: center; justify-content: space-between; margin: 0 -8px 4px; }
.period-label { border: 0; background: none; font-weight: 600; font-size: 16px; padding: 8px 12px; border-radius: 10px; }
.period-label::first-letter { text-transform: uppercase; }
.period-label:active { background: var(--press); }

/* Destaques */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 14px 4px 18px; gap: 2px; }
.hero.small { padding: 8px 4px 14px; }
.hero-label { font-size: 14px; color: var(--fg-2); }
.hero-value { font-family: var(--font-display); font-size: 40px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.hero.small .hero-value { font-size: 30px; }
.hero-sub { font-size: 13px; color: var(--fg-2); }
.hero-meter { width: min(320px, 100%); margin: 10px 0 4px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 4px 0 8px; }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--card); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile-label { font-size: 13px; color: var(--fg-2); }
.tile-value { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-sub { font-size: 12px; color: var(--fg-2); }

/* Seções e listas agrupadas */
.sec { margin-top: 26px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 6px; }
.sec-head h2 { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.sec-total { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
.link { border: 0; background: none; color: var(--accent); font-size: 16px; padding: 4px 0; }
.link.strong { font-weight: 600; }

.group { background: var(--card); border-radius: var(--r); overflow: hidden; margin: 8px 0; }
.group.pad { padding: 12px 14px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; box-sizing: border-box;
  padding: 10px 14px; border: 0; background: none; text-align: left; position: relative; color: inherit; text-decoration: none;
}
.row + .row::before, .hbar + .hbar::before, .field + .field::before {
  content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.6);
}
button.row:active, a.row:active, label.row:active { background: var(--press); }
.row.static { cursor: default; }
.row.danger .row-title { color: var(--neg); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 13px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-right { color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; text-align: right; max-width: 55%; overflow: hidden; text-overflow: ellipsis; }
.row.stack { flex-direction: column; align-items: stretch; gap: 6px; }
.row-line { display: flex; align-items: center; gap: 12px; }
.row-line .row-title { flex: 1; min-width: 0; }
.row.stack .row-sub { white-space: normal; }
.menu-ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.menu-ico .ico { width: 19px; height: 19px; }

.amount { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; flex: none; }
.neg { color: var(--neg); }
.pos { color: var(--pos); }
.tx-ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.tx-ico .ico { width: 18px; height: 18px; stroke-width: 2; }
.tx-ico.retirada { background: var(--neg-soft); color: var(--neg); }
.tx-ico.deposito { background: var(--pos-soft); color: var(--pos); }
.tx-ico.transferencia { background: var(--accent-soft); color: var(--accent); }
.day { font-size: 13px; font-weight: 600; color: var(--fg-2); margin: 18px 4px 6px; }
.day::first-letter { text-transform: uppercase; }

.meter { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.meter > div { height: 100%; border-radius: 3px; background: var(--accent); }
.meter.warn { background: var(--warn-soft); }
.meter.warn > div { background: var(--warn); }
.meter.over { background: var(--neg-soft); }
.meter.over > div { background: var(--neg); }

.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; vertical-align: 1px; }
.chip.good { background: var(--pos-soft); color: var(--pos); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.bad { background: var(--neg-soft); color: var(--neg); }
.chip.muted { background: var(--card-2); color: var(--fg-2); }

.seg { display: flex; background: var(--seg-bg); border-radius: 10px; padding: 2px; margin: 4px 0 12px; gap: 2px; }
.seg > button, .seg label { flex: 1; border: 0; background: none; border-radius: 8px; padding: 7px 4px; font-size: 13px; font-weight: 600; text-align: center; color: var(--fg); min-width: 0; }
.seg > button[aria-selected="true"], .seg label:has(input:checked) { background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg label { position: relative; cursor: pointer; }
.seg label input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); }

.searchbox { display: flex; align-items: center; gap: 6px; background: var(--seg-bg); border-radius: 10px; padding: 0 10px; color: var(--fg-3); margin: 4px 0 10px; }
.searchbox .ico { width: 18px; height: 18px; }
.searchbox input { flex: 1; min-width: 0; border: 0; background: transparent; height: 38px; font-size: 16px; color: var(--fg); outline: none; }

.banner { background: var(--warn-soft); border-radius: var(--r); padding: 10px 14px; font-size: 14px; margin: 6px 0 12px; }
.banner.bad { background: var(--neg-soft); }
.empty { text-align: center; color: var(--fg-2); padding: 26px 18px; background: var(--card); border-radius: var(--r); margin: 8px 0; }
.empty p { margin: 0 0 12px; max-width: 34em; margin-inline: auto; }
.empty p:last-child { margin-bottom: 0; }
.muted { color: var(--fg-2); font-size: 14px; margin: 8px 4px; }
.small { font-size: 13px; }
.center { text-align: center; }

.btn { min-height: 44px; border-radius: var(--r); padding: 0 18px; font-size: 16px; font-weight: 600; border: 0; background: var(--card); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--neg); }
.btn.plain { background: transparent; padding: 0 4px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; }
.btn:active { filter: brightness(.94); }
.btn-row { display: flex; gap: 10px; margin: 16px 0; }
.btn-row .btn { flex: 1; }

.welcome, .about { background: var(--card); border-radius: 16px; padding: 28px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 8px 0; }
.welcome h2, .about h2 { font-family: var(--font-display); font-size: 24px; margin: 4px 0 0; letter-spacing: -.01em; }
.welcome p { color: var(--fg-2); margin: 0 0 6px; max-width: 30em; }
.about { text-align: left; align-items: stretch; }
.about h2, .about .glow { align-self: center; }
.about p { margin: 0; color: var(--fg-2); font-size: 15px; }
.glow { width: 44px; height: 44px; border-radius: 50%; position: relative; background: radial-gradient(circle, var(--glow) 0 22%, color-mix(in srgb, var(--glow) 40%, transparent) 40%, transparent 70%); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.18); opacity: .7; } }
.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 90px 0; color: var(--fg-2); }
.credit { text-align: center; font-size: 12px; color: var(--fg-3); margin: 30px 0 0; }
.credit a, .credit button { color: var(--fg-2); }
.credit button { border: 0; background: none; padding: 0; font-size: 12px; text-decoration: underline; }

/* Gráficos */
.chart { position: relative; width: 100%; }
.chart svg { display: block; touch-action: pan-y; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--fg-3); stroke-width: 1; }
.chart .tick { fill: var(--fg-3); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .line { stroke: var(--series-1); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--series-1); opacity: .1; }
.chart .dot { fill: var(--series-1); stroke: var(--card); stroke-width: 2; }
.chart .cross { stroke: var(--fg-3); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .band { fill: var(--press); }
.chart .s1 { fill: var(--series-1); }
.chart .s2 { fill: var(--series-2); }
.tip { position: absolute; top: 0; z-index: 2; pointer-events: none; background: var(--tip-bg); color: var(--tip-fg); border-radius: 8px; padding: 6px 9px; font-size: 12px; display: flex; flex-direction: column; gap: 1px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip b { font-weight: 600; font-size: 13px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--fg-2); margin-bottom: 6px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.sw.s1 { background: var(--series-1); }
.sw.s2 { background: var(--series-2); }
.hbar { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 9px 0; position: relative; color: inherit; }
.hbar + .hbar::before { left: 0; }
.hbar-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 5px; }
.hbar-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-val { font-variant-numeric: tabular-nums; color: var(--fg-2); flex: none; }
.hbar-track { display: block; height: 8px; border-radius: 4px; background: var(--series-1-soft); }
.hbar-fill { display: block; height: 100%; border-radius: 4px; background: var(--series-1); }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.table th, .table td { padding: 9px 8px; text-align: right; font-size: 13px; white-space: nowrap; }
.table th:first-child, .table td:first-child { text-align: left; padding-left: 12px; }
.table th:last-child, .table td:last-child { padding-right: 12px; }
.table th { color: var(--fg-2); font-size: 12px; font-weight: 600; }
.table tr + tr td, .table tbody tr:first-child td { border-top: 1px solid var(--sep); }

/* Folhas (formulários que sobem de baixo) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .38); opacity: 0; transition: opacity .2s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 680px;
  max-height: calc(100% - 20px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column;
  background: var(--bg); border-radius: 14px 14px 0 0; transform: translateY(100%); transition: transform .22s ease-out;
}
.sheet-wrap.open .sheet { transform: none; }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px var(--gutter-r) 6px var(--gutter-l); }
.sheet-head h2 { font-size: 17px; font-weight: 600; margin: 0; text-align: center; }
.sheet-head > :last-child { justify-self: end; }
.sheet-head > :first-child { justify-self: start; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px var(--gutter-r) calc(28px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
.confirm-text { margin: 8px 2px 18px; }
.form-error { color: var(--neg); margin: 12px 4px; font-weight: 500; }
.form-h { font-size: 13px; font-weight: 600; color: var(--fg-2); margin: 20px 4px 6px; }

.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; padding: 4px 14px; position: relative; box-sizing: border-box; }
.field-label { flex: none; max-width: 48%; }
.field input:not([type="checkbox"]), .field select {
  flex: 1; min-width: 0; border: 0; background: transparent; text-align: right; font-size: 16px; color: var(--fg); padding: 8px 0; outline: none;
}
.field select { text-align-last: right; appearance: none; -webkit-appearance: none; color: var(--accent); cursor: pointer; }
.field input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 1.4em; display: flex; justify-content: flex-end; }
.field input::placeholder, .field textarea::placeholder { color: var(--fg-3); }
.field:has(textarea) { flex-direction: column; align-items: stretch; gap: 2px; padding-block: 10px; }
.field textarea { border: 0; background: transparent; font-size: 16px; resize: vertical; outline: none; padding: 0; min-height: 2.6em; }
.field:focus-within { background: var(--press); }
.switch input { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--switch-off); position: relative; flex: none; margin: 0; cursor: pointer; transition: background .15s; }
.switch input::before { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .15s; }
.switch input:checked { background: var(--pos); }
.switch input:checked::before { transform: translateX(20px); }

form[data-type="retirada"] .only-deposito, form[data-type="retirada"] .only-transferencia,
form[data-type="deposito"] .only-retirada, form[data-type="deposito"] .only-transferencia,
form[data-type="transferencia"] .only-retirada, form[data-type="transferencia"] .only-deposito,
form[data-end="nunca"] .only-end-data, form[data-end="nunca"] .only-end-vezes,
form[data-end="data"] .only-end-vezes, form[data-end="vezes"] .only-end-data { display: none; }

.big-amount { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 10px 0 14px; }
.big-amount span { font-size: 24px; color: var(--fg-2); font-weight: 500; }
